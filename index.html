<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Corta</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Registro</h2>
    <form action="https://formsubmit.co/edwinvalec40@gmail.com" method="POST" id="encuestaForm">
        <div class="form-group">
            <label for="nombre">1. ¿Cuál es tu nombre?</label>
            <input type="text" id="nombre" required placeholder="Ej. Juan">
        </div>
        <div class="form-group">
            <label for="edad">2. ¿Cuál es tu edad?</label>
            <input type="number" id="edad" required placeholder="Ej. 25">
        </div>
        <button type="submit">Enviar Respuestas</button>
    </form>
</div>

<script>
document.getElementById('encuestaForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Evita que la página se recargue

    // 1. Recolectar las respuestas del usuario
    const nombre = document.getElementById('nombre').value;
    const edad = document.getElementById('edad').value;

    // 2. Obtener datos básicos del entorno del navegador (User Agent)
    // Nota: La precisión depende del navegador del visitante.
    const informacionNavegador = navigator.userAgent;

    // 3. Procesar o estructurar la información obtenida
    const datosConsolidados = {
        usuario: {
            nombre: nombre,
            edad: edad
        },
        tecnico: {
            plataforma: navigator.platform,
            agenteUsuario: informacionNavegador,
            idioma: navigator.language
        }
    };

    // Aquí simula el procesamiento del formulario
    console.log("Datos listos para enviar al servidor:", datosConsolidados);
    alert("¡Gracias por responder! Procesando información...");
    
    // NOTA: Para almacenar estos datos de forma remota, se suele configurar 
    // un backend básico (como una función Serverless o un script PHP/Node.js) 
    // que reciba este objeto JSON y lo guarde en una base de datos.
});
</script>

</body>
</html>
